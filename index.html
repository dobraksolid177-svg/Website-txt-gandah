<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R&D_Rafi&Delpiana</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="overlay"></div>

  <main class="container">

    <header class="header">
      <h1>R&D_Rafi&Delpiana</h1>
      <p>Text Generator & Pengulang Pesan</p>
    </header>

    <section class="form">

      <label for="pesan">📝 Pesan / Text</label>

      <textarea
        id="pesan"
        placeholder="Tulis pesan yang ingin dibuat..."
      ></textarea>

      <label for="jumlah">🔢 Jumlah Pengulangan</label>

      <input
        type="number"
        id="jumlah"
        min="1"
        max="10000"
        value="10"
        placeholder="Masukkan jumlah..."
      >

      <div class="buttons">

        <button id="generateBtn" class="btn generate">
          ⚡ Buat Text
        </button>

        <button id="copyBtn" class="btn copy">
          📋 Salin
        </button>

        <button id="clearBtn" class="btn clear">
          🗑️ Bersihkan
        </button>

      </div>

    </section>

    <section class="result">

      <label for="hasil">📄 Hasil Text</label>

      <textarea
        id="hasil"
        readonly
        placeholder="Hasil akan muncul di sini..."
      ></textarea>

      <p id="counter" class="counter">
        Belum ada text dibuat
      </p>

    </section>

      <footer>
    © 2026 R&D_Rafi&Delpiana
  </footer>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <button id="musicBtn" class="music-btn">
    🎵 Putar Musik
  </button>

  <script src="script.js"></script>

</body>
</html>
