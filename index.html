<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R&D_Rafi&Delpiana</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>R&D_Rafi&Delpiana ♥SAYANGG♥</h1>
      <p>Text Generator & Pengulang Pesan</p>
    </header>

    <!-- TEXT GENERATOR -->
    <section class="form">

      <label for="pesan">📝 Pesan / Text</label>

      <textarea
        id="pesan"
        placeholder="Tulis pesan yang ingin dibuat..."
      ></textarea>

      <label for="jumlah">🔢 Jumlah Pengulangan</label>

      <input
        type="number"
        id="jumlah"
        min="1"
        max="10000"
        value="10"
      >

      <div class="buttons">

        <button id="generateBtn" class="btn generate">
          ⚡ Buat Text
        </button>

        <button id="copyBtn" class="btn copy">
          📋 Salin
        </button>

        <button id="clearBtn" class="btn clear">
          🗑️ Bersihkan
        </button>

      </div>

    </section>


    <!-- HASIL -->
    <section class="result">

      <label for="hasil">📄 Hasil Text</label>

      <textarea
        id="hasil"
        readonly
        placeholder="Hasil akan muncul di sini..."
      ></textarea>

      <p id="counter" class="counter">
        Belum ada text dibuat
      </p>

    </section>


    <!-- MUSIC -->
    <section class="music-section">

      <div class="music-disc">
        🎵
      </div>

      <h2>Sesi Potret</h2>

      <p id="musicStatus">
        Musik belum diputar
      </p>

      <audio id="bgMusic" preload="metadata">
        <source src="sesi-potret.mp3" type="audio/mpeg">
      </audio>

      <button id="musicBtn" class="music-btn">
        ▶️ Putar Musik
      </button>

    </section>


    <!-- LIRIK -->
    <section class="lyrics-section">

      <h2>🎤 Lirik</h2>

      <div class="lyrics-box">
        <div id="lyricsContainer" class="lyrics-container">
        </div>
      </div>

    </section>


    <footer>
      © 2026 R&D_Rafi&Delpiana ♥KHUSUS SAYANGGKUU♥
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
